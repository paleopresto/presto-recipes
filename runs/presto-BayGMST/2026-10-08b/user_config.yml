# BayGMST run on the PAGES 2k (2017) pool screened against local
# instrumental temperature (pages2k2017_local10: p < 0.10, 1850-2000),
# 2026-10-08b snapshot. LASSO reduced proxy, 1-2000 CE, instrumental period
# from 1850. Local fits on this pool converge (max rhat 1.0 at 1000/1000);
# the longer sampling is kept from the unscreened run.
ptype: ALL
rp_method: LASSO
stan_params:
  iter_warmup: 1000
  iter_sampling: 2000
  chains: 4
  parallel_chains: 4
partition_years:
  t1: 1
  t2: 1850
  t3: 2000
co2_params:
  c0: 280
  co2_coef: 5.35
vol_params:
  vol_coef: 25.0
seed: 1
