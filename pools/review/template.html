<title>Presto Record Review</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600&family=IBM+Plex+Sans:wght@400;600&display=swap">
<style>
/* Layout: a fixed record list on the left, and a dense two-column review sheet on the right (series and map on top, metadata and curation below), operated from the keyboard. */
:root {
  --bg: #f3f4f1; --panel: #ffffff; --ink: #1d2324; --muted: #5d6768; --faint: #8b9596; --line: #dde1dc;
  --accent: #1f6f78; --accent-soft: #d9ecee; --sel: #e7efe9;
  --ok: #2e7d4f; --ok-soft: #dcefe3; --flag: #a86a00; --flag-soft: #f7ead0; --bad: #b3332b; --bad-soft: #f6dcd9;
  --land: #e4e2da; --water: #f7f8f6; --coast: #c9c6bb;
  --f-ui: "IBM Plex Sans Condensed", "Arial Narrow", system-ui, sans-serif;
  --f-body: "IBM Plex Sans", system-ui, sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #151a1b; --panel: #1d2425; --ink: #e3e8e6; --muted: #a2adac; --faint: #77827f; --line: #2f3839;
  --accent: #5fb7bf; --accent-soft: #1f3a3d; --sel: #233130;
  --ok: #6cc28d; --ok-soft: #1f3a2a; --flag: #e0a83a; --flag-soft: #3d311b; --bad: #ec7d74; --bad-soft: #432422;
  --land: #2b3233; --water: #192021; --coast: #3e4849; color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #151a1b; --panel: #1d2425; --ink: #e3e8e6; --muted: #a2adac; --faint: #77827f; --line: #2f3839;
  --accent: #5fb7bf; --accent-soft: #1f3a3d; --sel: #233130;
  --ok: #6cc28d; --ok-soft: #1f3a2a; --flag: #e0a83a; --flag-soft: #3d311b; --bad: #ec7d74; --bad-soft: #432422;
  --land: #2b3233; --water: #192021; --coast: #3e4849; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--ink); font: 13px/1.4 var(--f-body); }
.app { display: grid; grid-template-columns: 280px minmax(0, 1fr); height: 100%; }
aside { border-right: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; background: var(--panel); }
.brand { padding: 12px 14px 8px; font: 600 15px var(--f-ui); letter-spacing: .01em; display: flex; justify-content: space-between; align-items: baseline; }
.brand small { font: 400 11px var(--f-mono); color: var(--muted); }
.filters { padding: 0 14px 10px; display: grid; gap: 6px; border-bottom: 1px solid var(--line); }
.filters input, .filters select { width: 100%; font: 13px var(--f-ui); padding: 5px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--bg); color: var(--ink); }
.filters .row { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.progress { font: 12px var(--f-ui); color: var(--muted); display: flex; gap: 10px; flex-wrap: wrap; }
.progress b { font-weight: 600; color: var(--ink); font-variant-numeric: tabular-nums; }
.list { overflow-y: auto; flex: 1; min-height: 0; }
.item { display: grid; grid-template-columns: 8px minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 6px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
.item:hover { background: var(--sel); }
.item[aria-selected="true"] { background: var(--accent-soft); }
.item .nm { font: 500 13px var(--f-ui); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .sub { font: 11px var(--f-mono); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.item .st { font: 600 10px var(--f-ui); letter-spacing: .06em; text-transform: uppercase; }
.dot { width: 8px; height: 8px; border-radius: 50%; }
.keys { padding: 8px 14px; border-top: 1px solid var(--line); font: 11px var(--f-ui); color: var(--muted); line-height: 1.7; }
kbd { font: 11px var(--f-mono); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 3px; padding: 0 4px; background: var(--bg); color: var(--ink); }
main { overflow-y: auto; min-width: 0; padding: 12px 18px 24px; }
.head { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: start; margin-bottom: 10px; }
h1 { font: 600 20px/1.2 var(--f-ui); margin: 0; text-wrap: balance; overflow-wrap: anywhere; }
.ids { font: 12px var(--f-mono); color: var(--muted); margin-top: 3px; display: flex; gap: 12px; flex-wrap: wrap; }
.ids a { color: var(--accent); }
.chips { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 7px; }
.chip { font: 500 11px var(--f-ui); padding: 1px 7px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.chip.acc { background: var(--accent-soft); border-color: transparent; color: var(--accent); }
.chip.warn { background: var(--flag-soft); border-color: transparent; color: var(--flag); }
.chip.bad { background: var(--bad-soft); border-color: transparent; color: var(--bad); }
.chip.good { background: var(--ok-soft); border-color: transparent; color: var(--ok); }
.verdict { display: grid; gap: 6px; justify-items: end; }
.vbtns { display: flex; gap: 4px; }
.vbtns button { font: 600 12px var(--f-ui); padding: 6px 10px; border-radius: 4px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; display: flex; gap: 6px; align-items: center; }
.vbtns button:focus-visible, .item:focus-visible, button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.vbtns button[data-v="ok"][aria-pressed="true"] { background: var(--ok); color: var(--panel); border-color: var(--ok); }
.vbtns button[data-v="flag"][aria-pressed="true"] { background: var(--flag); color: var(--panel); border-color: var(--flag); }
.vbtns button[data-v="exclude"][aria-pressed="true"] { background: var(--bad); color: var(--panel); border-color: var(--bad); }
.save { font: 11px var(--f-ui); color: var(--faint); min-height: 14px; }
.alerts { display: grid; gap: 4px; margin-bottom: 10px; }
.alert { font: 13px var(--f-ui); padding: 6px 10px; border-radius: 4px; display: flex; gap: 8px; align-items: baseline; }
.alert.warn { background: var(--flag-soft); color: var(--ink); }
.alert.bad { background: var(--bad-soft); color: var(--ink); }
.alert b { font-weight: 600; }
.alert .ic { font: 600 11px var(--f-mono); }
.alert.warn .ic { color: var(--flag); } .alert.bad .ic { color: var(--bad); }
.grid { display: grid; grid-template-columns: minmax(0, 1.55fr) minmax(0, 1fr); gap: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px; min-width: 0; }
.card h2 { font: 600 11px var(--f-ui); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 8px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card h2 .tools { display: flex; gap: 4px; text-transform: none; letter-spacing: 0; }
.card h2 .tools button { font: 500 11px var(--f-ui); padding: 1px 7px; border: 1px solid var(--line); border-radius: 3px; background: var(--bg); color: var(--muted); cursor: pointer; }
.card h2 .tools button[aria-pressed="true"] { color: var(--accent); border-color: var(--accent); }
svg text { font-family: var(--f-mono); }
.chart { width: 100%; height: 260px; display: block; }
.map { width: 100%; aspect-ratio: 4 / 3; max-width: 100%; display: block; border-radius: 4px; }
dl.kv { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 3px 12px; margin: 0; }
dl.kv dt { font: 12px var(--f-ui); color: var(--muted); }
dl.kv dd { margin: 0; font: 12px var(--f-mono); overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
table { border-collapse: collapse; width: 100%; font: 12px var(--f-ui); }
th { text-align: left; font-weight: 500; color: var(--muted); border-bottom: 1px solid var(--line); padding: 3px 6px 3px 0; white-space: nowrap; }
td { padding: 3px 6px 3px 0; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
td.num { font: 12px var(--f-mono); font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }
.tbl { overflow-x: auto; }
.nbrow { cursor: default; }
.nbrow.go { cursor: pointer; } .nbrow.go:hover td { background: var(--sel); }
.nbn { font: 600 11px var(--f-mono); color: var(--accent); }
.stack { display: grid; gap: 12px; align-content: start; }
.crit { display: flex; flex-wrap: wrap; gap: 4px; }
.note-q { font: 12px var(--f-body); color: var(--ink); background: var(--bg); border-left: 3px solid var(--accent); padding: 6px 8px; margin: 0 0 8px; overflow-wrap: anywhere; }
.pub { font: 12px/1.45 var(--f-body); margin: 0 0 6px; }
.pub a { color: var(--accent); }
.muted { color: var(--muted); }
textarea { width: 100%; min-height: 54px; font: 13px var(--f-body); padding: 6px 8px; border-radius: 4px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); resize: vertical; }
.full { grid-column: 1 / -1; }
.banner { font: 12px var(--f-ui); color: var(--muted); margin-bottom: 8px; }
.empty { color: var(--faint); font: 12px var(--f-ui); }
@media (max-width: 900px) {
  .app { grid-template-columns: 1fr; height: auto; }
  aside { border-right: 0; border-bottom: 1px solid var(--line); }
  .list { max-height: 220px; }
  .grid { grid-template-columns: 1fr; }
  main { padding: 12px 16px 24px; }
  .head { grid-template-columns: 1fr; }
  .verdict { justify-items: start; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

const archColor = a => ARCH[a] || ARCH.Other;
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const fmt = (x, d = 1) => x == null ? 'n/a' : Number(x).toLocaleString(undefined, { maximumFractionDigits: d });
const yr = x => x == null ? 'n/a' : (Math.round(x * 10) / 10).toString();
const docId = r => (r.compilation + '__' + r.TSid).replace(/[^A-Za-z0-9_.~:@+-]/g, c => '~' + c.charCodeAt(0).toString(16));

// review state: db when available, else this browser
let reviews = {}; let db = null; let store = 'local';
try { reviews = JSON.parse(localStorage.getItem('presto-review') || '{}'); } catch (e) { reviews = {}; }
const saveLocal = () => { try { localStorage.setItem('presto-review', JSON.stringify(reviews)); } catch (e) {} };

// alerts computed from the data
function alertsFor(r) {
  const a = [];
  const dup = (r.neighbors || []).filter(n => n.km <= 5 && n.variable === r.variable && n.archive === r.archive);
  dup.forEach(n => a.push(['bad', 'DUP', `<b>${esc(n.name)}</b> (${esc(n.TSid)}) is also in ${r.compilation}, ${n.km} km away, same archive and variable.`]));
  if (r.psm && r.psm.status === 'drop_direction') a.push(['bad', 'LMR', 'Dropped from the LMR run: no candidate season gives the interpreted sign.']);
  if (r.psm && r.psm.status === 'drop_interpretation') a.push(['bad', 'LMR', 'Dropped from the LMR run: interpretation names no variable its PSM uses.']);
  if (r.psm && r.psm.status === 'pass_reseasoned') a.push(['warn', 'LMR', 'Recalibrated on another season to get the interpreted sign: ' + esc(r.psm.detail || '')]);
  if (r.psm && r.psm.status === 'uninterpreted') a.push(['warn', 'INT', 'No climate interpretation; LMR calibrated it without a sign check.']);
  if (r.compilation === 'Presto2k' && !r.psm) a.push(['warn', 'LMR', 'Not calibrated in the LMR run (too little overlap with instrumental data, or failed calibration).']);
  if (!r.interpretations || !r.interpretations.length) a.push(['warn', 'INT', 'No interpretation metadata.']);
  if (r.selectedBy && /admission/.test(r.selectedBy)) a.push(['warn', 'CUR', 'Admitted by a curator ledger although it fails a criterion' + (r.fails ? ': ' + esc(r.fails) : '.')]);
  if (r.selectedBy && /exception/.test(r.selectedBy)) a.push(['warn', 'CUR', 'Kept by the data-poor exception (no other record nearby).']);
  return a;
}
R.forEach(r => { r._alerts = alertsFor(r); r._curated = (r.decisions || []).length > 0 || /admission|exception/.test(r.selectedBy || ''); });

// list and filters
const archives = [...new Set(R.map(r => r.archive))].sort();
$('#fa').insertAdjacentHTML('beforeend', archives.map(a => `<option>${esc(a)}</option>`).join(''));
$('#snap').textContent = D.snapshot;
let view = R.slice(); let cur = 0;
function statusOf(r) { return (reviews[docId(r)] || {}).status || 'todo'; }
function applyFilters(keep) {
  const q = $('#q').value.trim().toLowerCase(), fc = $('#fc').value, fa = $('#fa').value, fs = $('#fs').value, fx = $('#fx').value;
  const curRec = view[cur];
  view = R.filter(r => (!fc || r.compilation === fc) && (!fa || r.archive === fa) && (!fs || statusOf(r) === fs)
    && (!fx || (fx === 'alert' ? r._alerts.length : r._curated))
    && (!q || [r.dataSetName, r.TSid, r.siteName, r.variable, r.proxy].join(' ').toLowerCase().includes(q)));
  cur = keep && curRec ? Math.max(0, view.indexOf(curRec)) : 0;
  renderList(); show();
}
['#q', '#fc', '#fa', '#fs', '#fx'].forEach(s => $(s).addEventListener('input', () => applyFilters(true)));
const ST = { ok: ['var(--ok)', 'OK'], flag: ['var(--flag)', 'Flag'], exclude: ['var(--bad)', 'Excl'], todo: ['var(--faint)', ''] };
function renderList() {
  $('#list').innerHTML = view.map((r, i) => {
    const s = statusOf(r);
    return `<div class="item" role="option" tabindex="-1" data-i="${i}" aria-selected="${i === cur}">
      <span class="dot" style="background:${archColor(r.archive)}" title="${esc(r.archive)}"></span>
      <span style="min-width:0"><div class="nm">${esc(r.dataSetName)}</div><div class="sub">${esc(r.compilation)} · ${esc(r.variable)} · ${r._alerts.length ? r._alerts.length + ' alert' + (r._alerts.length > 1 ? 's' : '') : 'no alerts'}</div></span>
      <span class="st" style="color:${ST[s][0]}">${ST[s][1]}</span></div>`;
  }).join('') || '<div class="item"><span></span><span class="empty">No records match these filters.</span></div>';
  const counts = { ok: 0, flag: 0, exclude: 0 };
  R.forEach(r => { const s = statusOf(r); if (counts[s] != null) counts[s]++; });
  const done = counts.ok + counts.flag + counts.exclude;
  $('#prog').innerHTML = `<span><b>${done}</b> of ${R.length} reviewed</span><span style="color:var(--ok)">${counts.ok} OK</span><span style="color:var(--flag)">${counts.flag} flagged</span><span style="color:var(--bad)">${counts.exclude} exclude</span><span>${view.length} shown</span>`;
}
$('#list').addEventListener('click', e => { const it = e.target.closest('.item[data-i]'); if (it) { cur = +it.dataset.i; renderList(); show(); } });

// time series chart
let flip = false;
function chart(r) {
  const W = 760, H = 260, m = { l: 54, r: 12, t: 10, b: 30 };
  const ys = r.series.year, vs = r.series.value;
  if (!ys.length) return '<div class="empty">No values in the export for this column.</div>';
  const holo = r.compilation === 'Presto12k';
  let x0 = Math.min(...ys), x1 = Math.max(...ys);
  if (x1 - x0 < 1) { x0 -= 1; x1 += 1; }
  let v0 = Math.min(...vs), v1 = Math.max(...vs); const pad = (v1 - v0) * 0.06 || 1; v0 -= pad; v1 += pad;
  const inv = flip;
  const X = x => m.l + (x - x0) / (x1 - x0) * (W - m.l - m.r);
  const Y = v => inv ? m.t + (v - v0) / (v1 - v0) * (H - m.t - m.b) : H - m.b - (v - v0) / (v1 - v0) * (H - m.t - m.b);
  const ticks = (a, b, n) => { const s = Math.pow(10, Math.floor(Math.log10((b - a) / n))); const st = [1, 2, 2.5, 5, 10].map(k => k * s).find(k => (b - a) / k <= n) || s * 10; const t = []; for (let v = Math.ceil(a / st) * st; v <= b + 1e-9; v += st) t.push(+v.toFixed(10)); return t; };
  let xt = holo ? ticks((1950 - x1) / 1000, (1950 - x0) / 1000, 7).map(k => 1950 - k * 1000) : ticks(x0, x1, 8);
  xt = xt.filter(x => x >= x0 && x <= x1);
  const yt = ticks(v0, v1, 5);
  let shade = '';
  const cal = holo ? null : [1850, 2015];
  if (cal && x1 > cal[0]) { const a = X(Math.max(cal[0], x0)), b = X(Math.min(cal[1], x1)); shade = `<rect x="${a}" y="${m.t}" width="${Math.max(0, b - a)}" height="${H - m.t - m.b}" fill="var(--accent-soft)"/><text x="${a + 4}" y="${m.t + 11}" font-size="10" fill="var(--accent)">calibration 1850-2015</text>`; }
  // line broken across gaps longer than 5x the median spacing
  const dt = ys.slice(1).map((y, i) => y - ys[i]).sort((a, b) => a - b); const med = dt[Math.floor(dt.length / 2)] || 1;
  let d = ''; ys.forEach((y, i) => { d += (i === 0 || y - ys[i - 1] > 5 * med ? 'M' : 'L') + X(y).toFixed(1) + ',' + Y(vs[i]).toFixed(1); });
  const pts = ys.length <= 400 ? ys.map((y, i) => `<circle cx="${X(y).toFixed(1)}" cy="${Y(vs[i]).toFixed(1)}" r="1.8" fill="var(--accent)"/>`).join('') : '';
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Time series of ${esc(r.variable)}">
    ${shade}
    ${yt.map(v => `<line x1="${m.l}" x2="${W - m.r}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--line)"/><text x="${m.l - 6}" y="${Y(v) + 3}" text-anchor="end" font-size="10" fill="var(--muted)">${+v.toPrecision(4)}</text>`).join('')}
    ${xt.map(x => `<line x1="${X(x)}" x2="${X(x)}" y1="${H - m.b}" y2="${H - m.b + 4}" stroke="var(--faint)"/><text x="${X(x)}" y="${H - m.b + 15}" text-anchor="middle" font-size="10" fill="var(--muted)">${holo ? +((1950 - x) / 1000).toFixed(1) : Math.round(x)}</text>`).join('')}
    <line x1="${m.l}" x2="${W - m.r}" y1="${H - m.b}" y2="${H - m.b}" stroke="var(--faint)"/>
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="1.3" stroke-linejoin="round"/>
    ${pts}
    <text x="${W - m.r}" y="${H - 3}" text-anchor="end" font-size="10" fill="var(--muted)">${holo ? 'ka BP' : 'year CE'}</text>
    <text transform="translate(12 ${(H - m.b + m.t) / 2}) rotate(-90)" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(r.variable)} (${esc(r.units || 'no units')})${inv ? ', axis flipped' : ''}</text>
  </svg>`;
}

// map: equirectangular, zoomed to the record and its neighbours
function mapSvg(r) {
  const W = 400, H = 300; const nb = r.neighbors || [];
  const lon0 = r.lon;
  const wrap = l => { let x = l - lon0; while (x > 180) x -= 360; while (x < -180) x += 360; return x; };
  const pts = [[0, r.lat], ...nb.map(n => [wrap(n.lon), n.lat])];
  let xs = pts.map(p => p[0]), ys = pts.map(p => p[1]);
  let cx = (Math.min(...xs) + Math.max(...xs)) / 2, cy = (Math.min(...ys) + Math.max(...ys)) / 2;
  let span = Math.max(Math.max(...xs) - Math.min(...xs), (Math.max(...ys) - Math.min(...ys)) * W / H, 6) * 1.25;
  span = Math.min(span, 360);
  const sx = W / span, sy = sx * Math.min(1.6, 1 / Math.max(0.35, Math.cos(cy * Math.PI / 180)));
  const P = (x, y) => [W / 2 + (x - cx) * sx, H / 2 - (y - cy) * sy];
  let land = '';
  for (const poly of LAND) {
    // unwrap each polygon from its first vertex, then draw it at three offsets so it shows across the antimeridian
    let base = poly[0] - lon0; while (base > 180) base -= 360; while (base < -180) base += 360;
    const shift = base - (poly[0] - lon0);
    for (const off of [-360, 0, 360]) {
      let d = '', inview = false;
      for (let i = 0; i < poly.length; i += 2) {
        const [px, py] = P(poly[i] - lon0 + shift + off, poly[i + 1]);
        if (px > -50 && px < W + 50 && py > -50 && py < H + 50) inview = true;
        d += (i ? 'L' : 'M') + px.toFixed(1) + ',' + py.toFixed(1);
      }
      if (inview) land += `<path d="${d}Z"/>`;
    }
  }
  const all = D.members[r.compilation];
  let bg = '';
  for (let i = 0; i < all.TSid.length; i++) { if (all.lat[i] == null) continue; const [px, py] = P(wrap(all.lon[i]), all.lat[i]); if (px >= 0 && px <= W && py >= 0 && py <= H) bg += `<circle cx="${px.toFixed(1)}" cy="${py.toFixed(1)}" r="2" fill="var(--faint)" opacity=".45"/>`; }
  const marks = nb.map((n, i) => { const [px, py] = P(wrap(n.lon), n.lat); return `<g><circle cx="${px}" cy="${py}" r="6.5" fill="${archColor(n.archive)}" stroke="var(--panel)" stroke-width="1.5"/><text x="${px}" y="${py + 3}" text-anchor="middle" font-size="8.5" font-weight="600" fill="#fff">${i + 1}</text></g>`; }).join('');
  const [tx, ty] = P(0, r.lat);
  const kmPerDeg = 111.2 * Math.cos(cy * Math.PI / 180); const barKm = [10, 20, 50, 100, 200, 500, 1000, 2000, 5000].find(k => k / kmPerDeg * sx > 50) || 5000; const barPx = barKm / kmPerDeg * sx;
  return `<svg class="map" viewBox="0 0 ${W} ${H}" role="img" aria-label="Map of the record and its nearest neighbours">
    <rect width="${W}" height="${H}" fill="var(--water)"/>
    <g fill="var(--land)" stroke="var(--coast)" stroke-width=".6">${land}</g>
    ${bg}${marks}
    <path d="M${tx},${ty - 9} L${tx + 2.6},${ty - 2.8} L${tx + 9},${ty - 2.8} L${tx + 3.9},${ty + 1.2} L${tx + 5.8},${ty + 7.6} L${tx},${ty + 3.8} L${tx - 5.8},${ty + 7.6} L${tx - 3.9},${ty + 1.2} L${tx - 9},${ty - 2.8} L${tx - 2.6},${ty - 2.8}Z" fill="var(--ink)" stroke="var(--panel)" stroke-width="1.5"/>
    <g transform="translate(10 ${H - 14})"><line x1="0" x2="${barPx}" y1="0" y2="0" stroke="var(--ink)" stroke-width="2"/><text x="${barPx + 5}" y="3.5" font-size="10" fill="var(--ink)">${barKm} km</text></g>
  </svg>`;
}

function show() {

  const rv = reviews[docId(r)] || {};
  const lipd = r.datasetVersion ? `https://lipdverse.org/data/${encodeURIComponent(r.datasetId)}/${r.datasetVersion.replace(/\./g, '_')}/` : null;

  const psm = r.psm ? `<dl class="kv"><dt>LMR screen</dt><dd>${esc(r.psm.status)}</dd><dt>PSM</dt><dd>${esc(r.psm.ptype)} on ${esc(r.psm.vars)}</dd><dt>adj. R²</dt><dd>${fmt(r.psm.r2adj, 3)}</dd><dt>slope on tas</dt><dd>${fmt(r.psm.slopeT, 4)}</dd>${r.psm.detail ? `<dt>detail</dt><dd>${esc(r.psm.detail)}</dd>` : ''}</dl>` : (r.compilation === 'Presto2k' ? '<p class="empty">Not calibrated in run 39104109040.</p>' : '<p class="empty">Holocene runs have no calibration screen.</p>');
  const scr = r.localScreen ? `<dl class="kv" style="margin-top:8px"><dt>BayGMST screen</dt><dd>${r.localScreen.pass ? 'pass' : 'fail'} (r ${fmt(r.localScreen.r, 2)}, p ${fmt(r.localScreen.p, 3)}, n ${r.localScreen.n})</dd></dl>` : '';
  $('#main').innerHTML = `
    <div class="head">
      <div style="min-width:0">
        <h1>${esc(r.dataSetName)}</h1>
        <div class="ids"><span>${esc(r.TSid)}</span><span>${esc(r.datasetId)} v${esc(r.datasetVersion || '?')}</span>${lipd ? `<a href="${lipd}" target="_blank" rel="noopener">LiPDverse page</a>` : ''}</div>
        <div class="chips">
          <span class="chip acc">${esc(r.compilation)} 0.0.1</span>
          <span class="chip"><span class="dot" style="display:inline-block;background:${archColor(r.archive)}"></span> ${esc(r.archive)}</span>
          <span class="chip">${esc(r.variable)}${r.units ? ' · ' + esc(r.units) : ''}</span>
          <span class="chip">${esc(r.selectedBy || '')}</span>
          ${(r.compilations || []).filter(c => !/PReSto|lipdverseTest/.test(c)).map(c => `<span class="chip">${esc(c)}</span>`).join('')}
        </div>
      </div>
      <div class="verdict">
        <div class="vbtns" role="group" aria-label="Review verdict">

          <button id="v-flag" data-v="flag" aria-pressed="${rv.status === 'flag'}"><kbd>2</kbd> Flag</button>
          <button id="v-ex" data-v="exclude" aria-pressed="${rv.status === 'exclude'}"><kbd>3</kbd> Exclude</button>
        </div>
        <div class="save" id="save">${store === 'db' ? 'Saved to the shared review list' : 'Saved in this browser only'}</div>
      </div>
    </div>
    ${r._alerts.length ? `<div class="alerts">${r._alerts.map(a => `<div class="alert ${a[0]}"><span class="ic">${a[1]}</span><span>${a[2]}</span></div>`).join('')}</div>` : ''}
    <div class="grid">
      <section class="card"><h2>Time series <span class="tools"><button id="flip" aria-pressed="${flip}">Flip y</button></span></h2>${chart(r)}
        <dl class="kv" style="margin-top:6px;grid-template-columns:repeat(4,max-content minmax(0,1fr))">
          <dt>span</dt><dd>${yr(r.start)} to ${yr(r.end)}</dd><dt>values</dt><dd>${fmt(r.n, 0)}</dd>

        </dl></section>

      <div class="stack">
        <section class="card"><h2>Interpretation</h2>

          ${r.description ? `<dt>description</dt><dd>${esc(r.description)}</dd>` : ''}
          ${r.calibrationMethod ? `<dt>calibration</dt><dd>${esc(r.calibrationMethod)}</dd>` : ''}

        <section class="card"><h2>Your note</h2><textarea id="note" placeholder="What needs to change? (n to focus)">${esc(rv.note || '')}</textarea></section>
      </div>
    </div>`;
  document.querySelectorAll('.vbtns button').forEach(b => b.addEventListener('click', () => setStatus(b.dataset.v)));
  $('#flip').addEventListener('click', () => { flip = !flip; show(); });
  let t = null; $('#note').addEventListener('input', e => { clearTimeout(t); const v = e.target.value; t = setTimeout(() => saveReview(r, { note: v }), 700); });
  document.querySelectorAll('.nbrow.go').forEach(tr => tr.addEventListener('click', () => { const k = view.findIndex(x => x.compilation === r.compilation && x.TSid === tr.dataset.ts); if (k >= 0) { cur = k; renderList(); show(); } }));
  const sel = document.querySelector(`.item[data-i="${cur}"]`); if (sel) sel.scrollIntoView({ block: 'nearest' });
}

let writing = Promise.resolve();
function saveReview(r, patch) {
  const id = docId(r);
  const next = { ...(reviews[id] || {}), ...patch, TSid: r.TSid, compilation: r.compilation, dataSetName: r.dataSetName, updated: new Date().toISOString() };
  reviews[id] = next; saveLocal(); renderList();
  const el = $('#save');
  if (db) {
    writing = writing.then(() => db.collection('reviews').doc(id).set(next)).then(() => { if (el) el.textContent = 'Saved to the shared review list'; })
      .catch(e => { if (el) el.textContent = 'Could not save to the shared list (' + (e && e.code || 'error') + '); kept in this browser.'; });
  } else if (el) el.textContent = 'Saved in this browser only';
}
function setStatus(v) {
  const r = view[cur]; if (!r) return;
  const curS = (reviews[docId(r)] || {}).status;
  saveReview(r, { status: v === curS ? null : v });
  document.querySelectorAll('.vbtns button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === (reviews[docId(r)] || {}).status)));
}
document.addEventListener('keydown', e => {
  if (e.target.matches('input, textarea, select')) { if (e.key === 'Escape') e.target.blur(); return; }
  if (e.metaKey || e.ctrlKey || e.altKey) return;
  const k = e.key;
  if (k === 'j' || k === 'ArrowDown') { cur = Math.min(view.length - 1, cur + 1); renderList(); show(); e.preventDefault(); }
  else if (k === 'k' || k === 'ArrowUp') { cur = Math.max(0, cur - 1); renderList(); show(); e.preventDefault(); }
  else if (k === '1') setStatus('ok'); else if (k === '2') setStatus('flag'); else if (k === '3') setStatus('exclude');
  else if (k === '0') { const r = view[cur]; if (r) { saveReview(r, { status: null }); show(); } }
  else if (k === 'n') { const n = $('#note'); if (n) { n.focus(); e.preventDefault(); } }
  else if (k === 'f') { flip = !flip; show(); }
  else if (k === 'u') { const i = view.findIndex((r, j) => j > cur && statusOf(r) === 'todo'); if (i >= 0) { cur = i; renderList(); show(); } }
  else if (k === '/') { $('#q').focus(); e.preventDefault(); }
});

renderList(); show();

// shared review list, when this view has it
(async () => {
  try {
    const d = window.claude && window.claude.use ? await window.claude.use('db') : null;
    if (!d) return;
    db = d; store = 'db';
    db.collection('reviews').onSnapshot(snap => {
      const fresh = {};
      snap.docs.forEach(doc => { if (doc.exists) fresh[doc.id] = doc.data(); });
      // keep local edits that have not reached the store yet
      for (const [k, v] of Object.entries(reviews)) if (!fresh[k] || (v.updated || '') > (fresh[k].updated || '')) fresh[k] = v;
      reviews = fresh; saveLocal(); renderList();
      const r = view[cur]; if (r && document.activeElement !== $('#note')) {
        document.querySelectorAll('.vbtns button').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.v === (reviews[docId(r)] || {}).status)));
      }
      const el = $('#save'); if (el && el.textContent.includes('browser only')) el.textContent = 'Saved to the shared review list';
    }, () => { store = 'local'; db = null; const el = $('#save'); if (el) el.textContent = 'Saved in this browser only'; });
  } catch (e) { /* stay on browser storage */ }
})();
})();
</script>
