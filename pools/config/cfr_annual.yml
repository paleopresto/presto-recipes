# Annual Common Era pool for presto-LMR: every annually resolved site series
# the LMR container can assimilate, whatever its interpretation.
#
# A record qualifies on what cfr needs (an annual time step, a proxy class it
# can model, overlap with the calibration period) and on being annual in
# information (repeat and lag-1 checks). Whether it carries the climate signal
# its PSM assumes is checked in the run, after calibration, against the
# record's own interpretations (presto-templates LMR2 cfr_main_code.py):
# interpretations must name a variable the PSM uses, and their directions must
# agree with the fitted slopes. Records with no interpretation are left to the
# calibration, as in LMRv2.1. This replaces PReSto2k's compilation-specific
# assembly (Gondhalekar et al., paleopresto/presto2k paleobook/C01_c), which
# would not extend to records added to LiPDverse later.

name: cfr_annual
description: Annually resolved Common Era records the LMR (cfr) container can calibrate and assimilate
reference: "Tardif et al. (2019) Clim. Past 15:1251 (LMRv2.1); PReSto2k assembly, paleopresto/presto2k C01_c"
baseline: presto2k_2025.csv
evaluator: cfr_annual

window: {min_year: 1, max_year: 2100}

exclude_variable_pattern: "^uncertainty|uncertainty$|error|^notes$|needsToBeChanged|^correction$|count$|^sampleCount$|^segmentLength$|^EPS$|^RBAR$|^core$|^correlationCoefficient$|^residualChronology$|^ARSTAN$"
# Units that rule a record out of an annual DA: the placeholder
# (Ammersee.Czymzik.2012 thickness), and rates per century or millennium,
# which are smoothed on whatever grid they are posted (Wirth et al. 2013
# flood frequencies, count/century on a 1-yr grid; SipleDomeA.Das.2008 melt
# layers, count/kyr).
exclude_units_pattern: "needsToBeChanged|/ ?century$|/ ?kyr$|/ ?ka$|per century"

# Interpretation is not required (2026-10-12). Every column enters, and the
# LMR run checks each calibrated record against its metadata instead: a
# record whose interpretations name no variable its PSM uses (a salinity
# coral, a sea-ice sodium series, a precipitation-isotope-only record under a
# temperature PSM) is dropped, as is one whose fitted slope has the opposite
# sign to the interpretation's direction. A record with no interpretation is
# left to the calibration. See presto-templates LMR2 cfr_main_code.py.
require_climate: false
# ...but an uninterpreted column only from a dataset with no interpreted
# column (climate or isotope scope). Where some columns are interpreted, the
# others (sibling chronologies, d13C beside d18O, ice chemistry beside
# isotopes) stay out.
uninterpreted_only_in_uninterpreted_datasets: true
# Without the interpretation requirement, the per-core measurement columns
# that LiPDverse's tree-ring imports carry beside each chronology would enter
# (12,009 in 2026-10-08b, all uninterpreted), as would per-colony
# calcification rates. A pool record is a site series.
exclude_description_pattern: "^Raw (ring width|MXD) measurements from series|measurements from individual samples"
# With require_climate: false these only fill the has_climate column.
interpretation:
  scope: climate
  variable: "*"
  max_rank: 99
  require_direction: false
  positive_only: null
climate_proxies:
  archives: [Coral, Sclerosponge, MolluskShell, GlacierIce, Speleothem]
  pattern: "^d18O$|^dD$|^d2H$|^Sr/Ca$|^SrCa$|^Mg/Ca$"

# cfr's filter on resolution (dt in years) and its PSM calibration window and
# minimum overlap (nobs_lb), as in the presto-LMR run config.
max_resolution: 1.2
# Annual in information, not only in time step: fail records whose successive
# in-window values repeat exactly at least this often (step functions on an
# annual grid: Wirth et al. 2013 flood counts per century, step-interpolated
# North Greenland Traverse accumulation series, IC16WE*, IC00SC29).
max_repeat_fraction: 0.5
# Fail records whose successive in-window values have lag-1 autocorrelation
# above this: series smoothed far beyond their annual step, which cfr would
# treat as independent annual observations. Operational, from the presto-paper
# LMR and BayGMST attribution (2026-10). There is no clean break: on
# 2026-10-08b the median is 0.58 and 0.98 is about the 98th percentile, with
# 15 records between 0.95 and 0.98 left in.
max_lag1: 0.98
calibration_period: [1850, 2015]
min_calibration_years: 25

# PAGES 2k (2017)'s length rules for annually resolved records.
length:
  annual_terrestrial: 300
  annual_marine: 50
marine_archives: [Coral, Sclerosponge, MolluskShell, MarineSediment]

# Archives lipd_to_pdb.py maps to a cfr proxy class (ptype) the LMR filter
# keeps (coral, tree, ice, lake, bivalve, marine, sclerosponge, speleothem,
# borehole, documents, hybrid).
assimilable_archives: [Coral, Wood, GlacierIce, LakeSediment, MolluskShell, MarineSediment,
                       Sclerosponge, Speleothem, Borehole, Documents, Hybrid]

data_poor_exception:
  isolation_km: 500
  relax:
    length.annual_terrestrial: 150
    length.annual_marine: 30

# PReSto2k's records are admitted; its 60 duplicate removals stand
# (make_ledgers.R).
curator_admissions: curator_admissions.csv
curator_exclusions: curator_exclusions.csv

collapse_prefer_units: []
# Duplicates: keep the copy with the most data (coverage, then resolution),
# then the newer publication, then fuller interpretation metadata; detect
# versions of one record across compilations and send those the rules cannot
# settle to the review queue (R/dedup.R).
dedup:
  prefer: data
one_record_per_site:
  - publication_title: "^LegacyClimate"
    prefer_season: annual
    defer_within_km: 8
