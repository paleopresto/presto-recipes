# Presto2k: Common Era temperature records, following the PAGES 2k
# Consortium (2017) inclusion criteria (Sci. Data 4:170088, "Record
# selection") as pages2k2017.yml does, with two changes (2026-11-13):
#   - temperature may be any of a record's interpretations, not only the
#     first-ranked one, as long as its direction is known;
#   - a temperature interpretation need not record its sign;
#   - annually resolved columns of common temperature proxies (coral Sr/Ca and
#     d18O, mostly CoralHydro2k) are admitted without an interpretation, from
#     datasets with no interpreted column, each with the direction its proxy
#     implies, which the method calibrating it enforces.
# What a method can assimilate (presto-LMR: an annual time step, overlap with
# the calibration period, a proxy class it models, independent years) is a
# screen on this compilation, not part of it. The pool keeps its name
# (cfr_annual) because the compilation exports are keyed on it.

name: cfr_annual
description: Common Era temperature records meeting the PAGES 2k (2017) criteria, with annual uninterpreted coral temperature proxies (Presto2k)
reference: "PAGES 2k Consortium (2017) Sci. Data 4:170088, doi:10.1038/sdata.2017.88"
baseline: pages2k_2_0_0.csv
evaluator: pages2k2017
# The PAGES 2k (2017) curator ledgers: its records that fail a criterion are
# admitted, and its curators' exclusions stand.
ledger_pool: pages2k2017

window: {min_year: 1, max_year: 2100}

exclude_variable_pattern: "^uncertainty|uncertainty$|error|^notes$|needsToBeChanged|^correction$|count$|^sampleCount$|^segmentLength$|^EPS$|^RBAR$|^core$|^correlationCoefficient$|^residualChronology$|^ARSTAN$"
# Units that rule a record out of an annual DA: the placeholder
# (Ammersee.Czymzik.2012 thickness), and rates per century or millennium,
# which are smoothed on whatever grid they are posted (Wirth et al. 2013
# flood frequencies, count/century on a 1-yr grid; SipleDomeA.Das.2008 melt
# layers, count/kyr).
exclude_units_pattern: "needsToBeChanged|/ ?century$|/ ?kyr$|/ ?ka$|per century"

interpretation:
  # Iso2k records temperature as an isotope-scope interpretation.
  scope: [climate, isotope]
  variable: temperature
  # Any rank (PAGES 2k took the first only): a record whose authors describe
  # a relation to temperature, as one of its interpretations, is in.
  max_rank: 99
  # PAGES 2k required a known sign; Presto2k keeps temperature records whose
  # sign is not recorded (2026-11-13). A common temperature proxy (below)
  # with no sign takes the one its proxy implies.
  require_direction: false
  # "Ring-width series ... correlate positively"; "inversely responding series
  # were excluded". Applied to tree-ring proxies only.
  positive_only:
    archives: [Wood]
    proxy_pattern: "ring width|TRW|MXD|density|BI|blue intensity"

# Common temperature proxies and the sign each implies. Uninterpreted columns
# of these are admitted only when annually resolved and only from datasets
# with no interpreted (climate or isotope scope) column; they, and interpreted
# records of these proxies with no recorded sign, carry the implied sign,
# and the method calibrating them rejects a fit of the other sign.
uninterpreted_temperature_proxies:
  - archives: [Coral, Sclerosponge]
    variable_pattern: "^Sr/?Ca$"
    direction: negative
  - archives: [Coral, Sclerosponge, MolluskShell]
    variable_pattern: "^d18O$"
    direction: negative
  - archives: [Coral]
    variable_pattern: "^Li/?Mg$"
    direction: negative

# Annual in information, not only in time step: fail records whose successive
# in-window values repeat exactly at least this often (step functions on an
# annual grid: Wirth et al. 2013 flood counts per century, step-interpolated
# North Greenland Traverse accumulation series, IC16WE*, IC00SC29).
max_repeat_fraction: 0.5
# Metric only (n_calib, for the method screens and the review site).
calibration_period: [1850, 2015]

# The PAGES 2k (2017) rules, as in pages2k2017.yml.
calendar_dated_archives: [Documents, Coral, Sclerosponge, MolluskShell, Wood]
# A record is annually resolved if its median spacing in the window is at most
# this many years. Operational: 1 year plus room for the odd missing ring.
annual_max_resolution: 1.5
marine_archives: [Coral, Sclerosponge, MolluskShell, MarineSediment]
length:
  annual_terrestrial: 300   # "annually resolved terrestrial records ... over 300 years"
  annual_marine: 50         # "annually resolved marine records ... exceeded 50 years"
  non_annual: 500           # "a minimum length of 500 years ... coarse initial screen"
resolution:
  # The median spacing over 1-2000 CE meets the cutoff, and the mean spacing
  # (span / (n - 1), PAGES 2k's "average resolution") is within 5% of it. The
  # median alone let sparse records with a few close samples pass (MS05ESCR:
  # 7 values over 1729 years, median 90 yr, mean 288 yr). Nick, 2026-11-16.
  metric: median_and_mean
  mean_tolerance: 1.05
  # Non-annual records need at least 10 values in 1-2000 CE, under the strict
  # and the data-poor thresholds alike (2-value marine cores otherwise pass the
  # relaxed rules). Nick, 2026-11-16.
  min_values: 10
  terrestrial: 50           # "terrestrial and lacustrine ... 50 years or finer"
  marine: 200               # "marine records: a minimum average resolution of 200 years"
  exempt_archives: [Borehole]
chronology:
  # "Layer-counted records" need no age control beyond their counting.
  layer_counted_archives: [Wood, Coral, Sclerosponge, MolluskShell, Documents, GlacierIce]
  layer_counted_proxy_pattern: "varve"
  # "at least one chronological control point near the most recent end of the
  # record ... another near the oldest part (or 1 CE, whichever is younger)";
  # records longer than 1000 years need one "approximately midway, typically
  # within two centuries of the midpoint". Operational: "near" is also 200 yr.
  tolerance: 200
  tolerance_resolution_multiple: 2
  midpoint_if_longer_than: 1000
  core_top_if_younger_than: 1900
  marine_reservoir_years: 400
  missing_chron: pass

# Relaxed thresholds for records with no strictly passing record within
# isolation_km (PAGES 2k's "regions with sparse data"). Operational values.
data_poor_exception:
  isolation_km: 500
  relax:
    length.annual_terrestrial: 150
    length.annual_marine: 30
    length.non_annual: 300
    # Resolution relaxed in the same proportion as the non-annual length
    # (500 -> 300 yr, 60%): 60% of the strict sampling density, so the
    # cutoffs are divided by 0.6 (50 -> 83, 200 -> 333 yr). Nick, 2026-11-16.
    resolution.terrestrial: 83
    resolution.marine: 333
    chronology.tolerance: 400

curator_admissions: curator_admissions.csv
curator_exclusions: curator_exclusions.csv
# Nick's "exclude" verdicts from the record review page.
review_verdicts: review/verdicts/presto2k.json

collapse_prefer_units: []
# Duplicates: keep the copy with the most data (coverage, then resolution),
# then the newer publication, then fuller interpretation metadata; detect
# versions of one record across compilations and send those the rules cannot
# settle to the review queue (R/dedup.R).
dedup:
  prefer: data
  # Within a dataset, each proxy keeps one seasonality (annual first) and one
  # variableName: a core gives its Mg/Ca or its Mg/Ca temperature, a pollen
  # site one season. Different proxies and several cores of one proxy stay.
  # Nick, 2026-11-16 (replaces collapse_by_variable, set when the pool took
  # any climate variable).
  one_variant_per_proxy: true
  # Within a dataset, records whose series correlate at |r| >= 0.98 are one
  # signal (varve thickness and its temperature, a table copied twice); keep
  # the best-ranked. Within-dataset pairs fall into two groups: 17 at 0.988 or
  # higher and the rest at 0.944 or lower. Nick, 2026-11-16.
  within_r: 0.98
  # Different-resolution versions of one record at one site (Penny Ice Cap
  # 25-yr vs 10-yr Fisher 1998): with one record at least 1.5 times coarser,
  # average the finer onto the coarser intervals; r >= 0.9 is a duplicate,
  # 0.8 to 0.9 goes to review. Nick, 2026-11-16.
  res_ratio: 1.5
  res_r: 0.9
  res_review_r: 0.8
  # From Nick's exclusions on the review page, 2026-11-17 (see dedup.R):
  # identical same-proxy copies up to 100 km apart (one has wrong coordinates);
  # a pair whose labels differ only because one has no proxy label is a
  # duplicate at |r| >= 0.99 within 2 km; same-proxy, not-annual pairs within
  # 10 km, one inside the other, at |r| or binned r >= 0.7 go to review.
  far_km: 100
  cross_label_r: 0.99
  cross_label_km: 2
  extension_r: 0.7
  extension_km: 10
  # Within one dataset, collapsing by proxy and season (and keeping one
  # variant per proxy) drops a record only if it holds the same measurements
  # as the one kept: |r| or binned r >= 0.9, or a seasonal series beside a
  # stated annual one in the same table. Separate cores and species stay.
  # Nick, 2026-11-17.
  within_collapse_r: 0.9
one_record_per_site:
  - publication_title: "^LegacyClimate"
    prefer_season: annual
    defer_within_km: 8
    by_variable: true
